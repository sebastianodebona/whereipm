### * Stages

stages:
  - build
  - deploy

### * installAndRender

installAndRender:
  image: rocker/tidyverse
  stage: build
  script:
    # Install missing R packages
    - Rscript -e 'install.packages(c("lme4", "glmmTMB", "plyr", "plotly", "sticky", "tidyverse", "RColorBrewer", "grDevices", "nlme", "stargazer", "roxygen2","car", "magick", "kable"))'
    # Build and install our package
    - Rscript -e "devtools::document(); devtools::install()"
    # Run pkgdown, including manuscript material preparation
    - Rscript -e "install.packages('pkgdown')"
    - make pkgdown
  artifacts:
    paths:
    - docs

### * pages a second job

pages:
  stage: deploy
  script:
    # Prepare folders for pages
    - mkdir -p public
    - mv docs/* public/
  artifacts:
    paths:
    - public
